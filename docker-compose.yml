services:
  postgres:
    image: imresamu/postgis:17-3.5
    container_name: nubi-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nubi}
      POSTGRES_USER: ${DB_USERNAME:-nubi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nubi}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/20-create-test-db.sql:/docker-entrypoint-initdb.d/20-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: nubi-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres-data:
