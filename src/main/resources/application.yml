spring:
  application:
    name: Nubi
  config:
    import: optional:file:./local-secret.properties
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  jpa:
    open-in-view: false

jwt:
  access-token:
    expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
  refresh-token:
    expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

external:
  data-go-kr:
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}

collect:
  enabled: ${COLLECT_ENABLED:false}
  run-on-startup: ${COLLECT_RUN_ON_STARTUP:false}
  cron: ${COLLECT_CRON:0 0 5 * * *}
  calendar-months: 3
  request-delay-ms: 1000
