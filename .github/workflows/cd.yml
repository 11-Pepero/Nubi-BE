name: CD

# main에 머지되면 Docker 이미지를 GHCR에 올리고, EC2에 설치한 셀프 호스티드 러너가 새 이미지로 바꿔 띄운다.
# 러너가 서버 안에서 GitHub로 먼저 연결하므로 SSH 포트를 열 필요가 없다.
# 필요한 설정: Variables의 DEPLOY_ENABLED=true, (선택) DEPLOY_PATH. 서버 준비는 deploy/README.md 참고.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 이미지 빌드·업로드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름 정하기
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nubi-be"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드하고 GHCR에 올리기
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.repo }}:latest
          # 패키지를 이 저장소에 연결해 두어야 다음 배포 때도 GITHUB_TOKEN으로 올릴 수 있다
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버 배포
    needs: build
    # 러너를 설치하기 전에는 배포 작업이 러너를 기다리며 멈춰 있지 않도록 변수로 켠다.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, nubi-prod]
    timeout-minutes: 15
    environment: production
    env:
      APP_IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/nubi' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false

      - name: compose 파일 배포 폴더로 복사
        run: |
          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "::error::$DEPLOY_PATH/.env 가 없습니다. deploy/README.md 의 항목대로 만들어 주세요."
            exit 1
          fi
          cp deploy/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"

      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 새 이미지로 교체
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          docker compose -f docker-compose.prod.yml pull app
          # 손으로 compose를 다시 실행할 때도 이 이미지를 쓰도록 표시해 둔다
          docker tag "$APP_IMAGE" nubi-be:current
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: 앱이 뜰 때까지 기다리기 (최대 3분)
        run: |
          for _ in $(seq 1 90); do
            if docker logs nubi-app 2>&1 | grep -q "Started NubiApplication"; then
              echo "배포 완료: $APP_IMAGE"
              docker image prune -f > /dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' nubi-app)" != "true" ]; then
              break
            fi
            sleep 2
          done
          echo "::error::앱이 정상적으로 뜨지 않았습니다."
          docker logs --tail 100 nubi-app
          exit 1

      - name: GHCR 로그아웃
        if: always()
        run: docker logout ghcr.io
