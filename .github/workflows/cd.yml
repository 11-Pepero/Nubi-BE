name: CD

# main에 머지되면 Docker 이미지를 GHCR에 올리고, SSH로 서버에 접속해 새 이미지로 바꿔 띄운다.
# 필요한 Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, (선택) SSH_PORT, DEPLOY_PATH
# 서버 준비와 Secrets 설명은 deploy/README.md 참고.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 이미지 빌드·업로드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름 정하기
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nubi-be"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드하고 GHCR에 올리기
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.repo }}:latest
          # 패키지를 이 저장소에 연결해 두어야 다음 배포 때도 GITHUB_TOKEN으로 올릴 수 있다
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버 배포
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HAS_SERVER: ${{ secrets.SSH_HOST != '' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/nubi' }}
    steps:
      - name: 서버 정보가 없으면 배포 건너뛰기
        if: env.HAS_SERVER != 'true'
        run: echo "::warning::SSH_HOST secret이 없어 서버 배포를 건너뜁니다. 이미지는 ${{ needs.build.outputs.image }} 로 올라갔습니다."

      - uses: actions/checkout@v4
        if: env.HAS_SERVER == 'true'

      - name: compose 파일 서버로 복사
        if: env.HAS_SERVER == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy/docker-compose.prod.yml
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: 새 이미지로 교체
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          command_timeout: 10m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            if [ ! -f .env ]; then
              echo "$DEPLOY_PATH/.env 가 없습니다. deploy/README.md 의 항목대로 만들어 주세요." >&2
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io

            # 앱이 뜰 때까지 최대 3분 기다린다. 뜨지 못하면 로그를 보여 주고 실패로 끝낸다.
            for i in $(seq 1 90); do
              if docker logs nubi-app 2>&1 | grep -q "Started NubiApplication"; then
                echo "배포 완료: $APP_IMAGE"
                docker image prune -f > /dev/null
                exit 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' nubi-app)" != "true" ]; then
                break
              fi
              sleep 2
            done
            echo "앱이 정상적으로 뜨지 않았습니다." >&2
            docker logs --tail 100 nubi-app >&2
            exit 1
